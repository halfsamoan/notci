name: Checks
on: [push, pull_request]
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: python tools/build_design.py --check
      - run: python tools/check_shared_design.py
      - run: glib-compile-schemas --strict --dry-run extension/schemas
      - run: node --check extension/extension.js
      - run: node --check extension/prefs.js
      - run: node --test tests/*.mjs
      - run: npx --yes eslint@9 --no-config-lookup -c eslint.config.mjs --max-warnings 0 'extension/**/*.js'
